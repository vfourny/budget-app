<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Applique le thème avant le chargement de React (évite un flash) : le choix mémorisé par
      // Mantine (« light » / « dark »), sinon (« auto » ou rien) celui du système.
      (function () {
        let scheme = null;
        try {
          scheme = localStorage.getItem("mantine-color-scheme-value");
        } catch {
          // localStorage indisponible (navigation privée stricte) : on suit le système.
        }
        if (scheme !== "light" && scheme !== "dark") {
          scheme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.mantineColorScheme = scheme;
      })();
    </script>
    <style>
      body {
        background: #0d0e10;
      }
      html[data-mantine-color-scheme="light"] body {
        background: #f4f3ef;
      }
    </style>
    <title>Budget</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
