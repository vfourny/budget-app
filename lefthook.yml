# Hooks Git versionnés, installés automatiquement par `pnpm install` (postinstall de lefthook).
# Contourner exceptionnellement : git commit --no-verify
pre-commit:
  piped: true # séquentiel : lint --fix, puis Prettier (qui a le dernier mot sur le format)
  commands:
    lint:
      priority: 1
      glob: '*.{ts,tsx,js,jsx,mjs,cjs,json}'
      run: pnpm exec eslint --fix --max-warnings 0 --no-warn-ignored {staged_files}
      stage_fixed: true
    format:
      priority: 2
      glob: '*.{ts,tsx,js,jsx,mjs,cjs,json,md,css,yml,yaml}'
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
