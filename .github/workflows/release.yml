# Release puis déploiement en prod (voir docs/environnements.md › Release).
# `release` (workflow partagé) : chaque push sur main met à jour la PR de release ; la merger crée
# le tag vX.Y.Z + la GitHub Release.
# `deploy` (workflow partagé deploy-branch) : avance la branche `production`, Production Branch
# de Vercel, sur le commit publié ; c'est ce push qui déploie la prod.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: vfourny/.github/.github/workflows/on-demand-release.yml@v4.0.0
    secrets:
      BOT_CLIENT_ID: ${{ secrets.BOT_CLIENT_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}

  deploy:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    uses: vfourny/.github/.github/workflows/deploy-branch.yml@v4.0.0
    permissions:
      contents: write
    with:
      sha: ${{ needs.release.outputs.sha }}
      branch: production
